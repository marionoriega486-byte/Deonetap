<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex">
  <title>DEONETAP</title>
</head>
<body>
<script>
const SUPABASE_URL = "https://pgezbktyhlyjnlxwlpsx.supabase.co";
const SUPABASE_KEY = "sb_publishable_m12HvUrizfuQHIUG9lWYrw_cU7sK_h0";

async function redirect() {
  try {
    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/deonetaps?code=eq.0001&active=eq.true&select=destination_url`,
      {
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${SUPABASE_KEY}`
        }
      }
    );

    if (!response.ok) throw new Error("Error consultando destino");

    const data = await response.json();

    if (data.length && data[0].destination_url) {
      window.location.replace(data[0].destination_url);
    } else {
      document.body.innerHTML = "<h2>DEONETAP no disponible</h2>";
    }
  } catch (error) {
    document.body.innerHTML = "<h2>No pudimos abrir el enlace. Intenta nuevamente.</h2>";
  }
}

redirect();
</script>
</body>
</html>
