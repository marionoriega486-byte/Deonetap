<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <title>Panel | DEONETAP</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #070707;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    header {
      padding: 22px;
      border-bottom: 1px solid #332a12;
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 4px;
    }

    .logo span {
      color: #d4af37;
    }

    main {
      max-width: 720px;
      margin: auto;
      padding: 28px 20px 60px;
    }

    h1 {
      margin-bottom: 8px;
    }

    .subtitle {
      color: #999;
      margin-bottom: 28px;
    }

    .card {
      background: #101010;
      border: 1px solid #292929;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 20px;
    }

    .label {
      color: #999;
      font-size: 13px;
      margin-bottom: 7px;
    }

    .code {
      font-size: 25px;
      font-weight: bold;
      color: #d4af37;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
    }

    input {
      width: 100%;
      background: #080808;
      border: 1px solid #333;
      color: white;
      border-radius: 10px;
      padding: 14px;
      font-size: 16px;
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 15px;
      background: #d4af37;
      color: #000;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
    }

    .status {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      background: #171717;
      display: none;
      line-height: 1.4;
    }

    .qr-url {
      overflow-wrap: anywhere;
      color: #d4af37;
      font-size: 14px;
    }

    .small {
      color: #888;
      font-size: 13px;
      line-height: 1.5;
    }

    footer {
      text-align: center;
      color: #666;
      padding: 30px;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">DEONE<span>TAP</span></div>
</header>

<main>

  <h1>Mi placa</h1>
  <div class="subtitle">
    Administra el destino de tu QR y NFC.
  </div>

  <div class="card">

    <div class="label">PLACA</div>
    <div class="code">DEONETAP 0001</div>

    <label for="destination">
      Enlace de destino
    </label>

    <input
      id="destination"
      type="url"
      placeholder="https://..."
      autocomplete="off"
    >

    <button id="saveButton" onclick="guardarDestino()">
      Guardar destino
    </button>

    <div id="status" class="status"></div>

  </div>

  <div class="card">

    <div class="label">
      ENLACE PERMANENTE DE ESTA PLACA
    </div>

    <p class="qr-url">
      https://marionoriega486-byte.github.io/Deonetap/r/0001/
    </p>

    <p class="small">
      Este es el enlace que debe llevar el QR impreso y el NFC.
      Aunque cambies el destino, este enlace permanece igual.
    </p>

  </div>

</main>

<footer>
  © 2026 DEONETAP
</footer>

<script>

const SUPABASE_URL =
  "https://pgezbktyhlyjnlxwlpsx.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_m12HvUrizfuQHIUG9lWYrw_cU7sK_h0";

const PLATE_CODE = "0001";


async function cargarDestino() {

  const status = document.getElementById("status");

  try {

    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/deonetaps?code=eq.${PLATE_CODE}&select=destination_url`,
      {
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${SUPABASE_KEY}`
        }
      }
    );

    if (!response.ok) {
      throw new Error("No se pudo consultar la placa.");
    }

    const data = await response.json();

    if (data.length) {

      document.getElementById("destination").value =
        data[0].destination_url || "";

    } else {

      status.style.display = "block";
      status.textContent = "No encontramos la placa 0001.";

    }

  } catch (error) {

    status.style.display = "block";
    status.textContent =
      "No se pudo cargar la información.";

  }
}


async function guardarDestino() {

  const input =
    document.getElementById("destination");

  const button =
    document.getElementById("saveButton");

  const status =
    document.getElementById("status");

  let url = input.value.trim();

  if (!url) {

    status.style.display = "block";
    status.textContent =
      "Escribe un enlace primero.";

    return;
  }

  if (
    !url.startsWith("https://") &&
    !url.startsWith("http://")
  ) {

    url = "https://" + url;
    input.value = url;
  }

  try {

    new URL(url);

  } catch {

    status.style.display = "block";
    status.textContent =
      "El enlace no es válido.";

    return;
  }

  button.disabled = true;
  button.textContent = "Guardando...";

  status.style.display = "block";
  status.textContent = "Guardando cambio...";

  try {

    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/deonetaps?code=eq.${PLATE_CODE}`,
      {
        method: "PATCH",

        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${SUPABASE_KEY}`,
          "Content-Type": "application/json",
          Prefer: "return=representation"
        },

        body: JSON.stringify({
          destination_url: url
        })
      }
    );

    if (!response.ok) {

      const errorText =
        await response.text();

      throw new Error(errorText);
    }

    const data =
      await response.json();

    if (!data.length) {
      throw new Error(
        "Supabase no permitió actualizar la placa."
      );
    }

    status.textContent =
      "✓ Destino actualizado correctamente.";

  } catch (error) {

    console.error(error);

    status.textContent =
      "No se pudo guardar. Revisa los permisos de la placa.";

  } finally {

    button.disabled = false;
    button.textContent = "Guardar destino";

  }
}


cargarDestino();

</script>

</body>
</html>
