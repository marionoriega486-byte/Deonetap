<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>Panel | DEONETAP</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #070707;
  color: #fff;
  font-family: Arial, Helvetica, sans-serif;
}

header {
  padding: 22px;
  border-bottom: 1px solid #332a12;
}

.logo {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: 4px;
}

.logo span { color: #d4af37; }

main {
  max-width: 720px;
  margin: auto;
  padding: 28px 20px 60px;
}

h1 { margin-bottom: 8px; }

.subtitle {
  color: #999;
  margin-bottom: 28px;
}

.card {
  background: #101010;
  border: 1px solid #292929;
  border-radius: 18px;
  padding: 22px;
  margin-bottom: 20px;
}

.label {
  color: #999;
  font-size: 13px;
  margin-bottom: 7px;
}

.code {
  font-size: 25px;
  font-weight: bold;
  color: #d4af37;
  margin-bottom: 20px;
}

label {
  display: block;
  margin-bottom: 8px;
  font-size: 14px;
}

input {
  width: 100%;
  background: #080808;
  border: 1px solid #333;
  color: #fff;
  border-radius: 10px;
  padding: 14px;
  font-size: 16px;
  margin-bottom: 15px;
}

button {
  width: 100%;
  border: 0;
  border-radius: 10px;
  padding: 15px;
  background: #d4af37;
  color: #000;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  margin-bottom: 10px;
}

button.secondary {
  background: #222;
  color: #fff;
}

button:disabled { opacity: .6; }

.status {
  margin-top: 12px;
  padding: 12px;
  border-radius: 10px;
  background: #171717;
  display: none;
  line-height: 1.4;
}

.qr-url {
  overflow-wrap: anywhere;
  color: #d4af37;
  font-size: 14px;
}

.small {
  color: #888;
  font-size: 13px;
  line-height: 1.5;
}

#panel { display: none; }

footer {
  text-align: center;
  color: #666;
  padding: 30px;
}
</style>
</head>

<body>

<header>
  <div class="logo">DEONE<span>TAP</span></div>
</header>

<main>

<section id="login">

  <h1>Iniciar sesión</h1>

  <div class="subtitle">
    Accede para administrar tus placas DEONETAP.
  </div>

  <div class="card">

    <label for="email">Correo electrónico</label>
    <input
      id="email"
      type="email"
      placeholder="correo@ejemplo.com"
      autocomplete="email"
    >

    <label for="password">Contraseña</label>
    <input
      id="password"
      type="password"
      placeholder="Tu contraseña"
      autocomplete="current-password"
    >

    <button id="loginButton" onclick="iniciarSesion()">
      Iniciar sesión
    </button>

    <div id="loginStatus" class="status"></div>

  </div>

</section>


<section id="panel">

  <h1>Mi placa</h1>

  <div class="subtitle">
    Administra el destino de tu QR y NFC.
  </div>

  <div class="card">

    <div class="label">PLACA</div>
    <div id="plateName" class="code">DEONETAP</div>

    <label for="destination">Enlace de destino</label>

    <input
      id="destination"
      type="url"
      placeholder="https://..."
      autocomplete="off"
    >

    <button id="saveButton" onclick="guardarDestino()">
      Guardar destino
    </button>

    <div id="saveStatus" class="status"></div>

  </div>

  <div class="card">

    <div class="label">
      ENLACE PERMANENTE DE ESTA PLACA
    </div>

    <p id="permanentUrl" class="qr-url"></p>

    <p class="small">
      Este es el enlace que debe llevar el QR impreso y el NFC.
      Aunque cambies el destino, este enlace permanece igual.
    </p>

  </div>

  <button class="secondary" onclick="cerrarSesion()">
    Cerrar sesión
  </button>

</section>

</main>

<footer>© 2026 DEONETAP</footer>

<script>

const SUPABASE_URL =
  "https://pgezbktyhlyjnlxwlpsx.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_m12HvUrizfuQHIUG9lWYrw_cU7sK_h0";

let accessToken = null;
let placaActual = null;


/* -------------------------
   SESIÓN
------------------------- */

function guardarSesion(session) {

  localStorage.setItem(
    "deonetap_session",
    JSON.stringify(session)
  );

}

function obtenerSesion() {

  const data =
    localStorage.getItem("deonetap_session");

  if (!data) return null;

  try {
    return JSON.parse(data);
  } catch {
    return null;
  }

}


/* -------------------------
   LOGIN
------------------------- */

async function iniciarSesion() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const status =
    document.getElementById("loginStatus");

  const button =
    document.getElementById("loginButton");

  status.style.display = "block";

  if (!email || !password) {

    status.textContent =
      "Escribe tu correo y contraseña.";

    return;
  }

  button.disabled = true;
  button.textContent = "Entrando...";

  status.textContent =
    "Verificando cuenta...";

  try {

    const response = await fetch(
      `${SUPABASE_URL}/auth/v1/token?grant_type=password`,
      {
        method: "POST",

        headers: {
          apikey: SUPABASE_KEY,
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          email: email,
          password: password
        })
      }
    );

    const data = await response.json();

    if (!response.ok || !data.access_token) {

      throw new Error(
        data.error_description ||
        data.msg ||
        "Correo o contraseña incorrectos."
      );

    }

    accessToken = data.access_token;

    guardarSesion(data);

    await mostrarPanel();

  } catch (error) {

    status.textContent =
      error.message ||
      "No se pudo iniciar sesión.";

  } finally {

    button.disabled = false;
    button.textContent = "Iniciar sesión";

  }

}


/* -------------------------
   CARGAR PLACA DEL CLIENTE
------------------------- */

async function mostrarPanel() {

  const login =
    document.getElementById("login");

  const panel =
    document.getElementById("panel");

  try {

    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/deonetaps?select=id,code,name,destination_url&order=created_at.asc&limit=1`,
      {
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${accessToken}`
        }
      }
    );

    if (!response.ok) {

      throw new Error(
        "No se pudieron cargar tus placas."
      );

    }

    const data = await response.json();

    if (!data.length) {

      throw new Error(
        "Esta cuenta todavía no tiene una placa asignada."
      );

    }

    placaActual = data[0];

    document.getElementById("plateName").textContent =
      placaActual.name ||
      `DEONETAP ${placaActual.code}`;

    document.getElementById("destination").value =
      placaActual.destination_url || "";

    document.getElementById("permanentUrl").textContent =
      `https://marionoriega486-byte.github.io/Deonetap/r/${placaActual.code}/`;

    login.style.display = "none";
    panel.style.display = "block";

  } catch (error) {

    const status =
      document.getElementById("loginStatus");

    status.style.display = "block";
    status.textContent = error.message;

  }

}


/* -------------------------
   GUARDAR DESTINO
------------------------- */

async function guardarDestino() {

  if (!placaActual || !accessToken) return;

  const input =
    document.getElementById("destination");

  const button =
    document.getElementById("saveButton");

  const status =
    document.getElementById("saveStatus");

  let url = input.value.trim();

  status.style.display = "block";

  if (!url) {

    status.textContent =
      "Escribe un enlace primero.";

    return;
  }

  if (
    !url.startsWith("https://") &&
    !url.startsWith("http://")
  ) {

    url = "https://" + url;
    input.value = url;

  }

  try {
    new URL(url);
  } catch {

    status.textContent =
      "El enlace no es válido.";

    return;
  }

  button.disabled = true;
  button.textContent = "Guardando...";

  status.textContent =
    "Guardando cambio...";

  try {

    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/deonetaps?id=eq.${placaActual.id}`,
      {
        method: "PATCH",

        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${accessToken}`,
          "Content-Type": "application/json",
          Prefer: "return=representation"
        },

        body: JSON.stringify({
          destination_url: url
        })
      }
    );

    const data = await response.json();

    if (!response.ok || !data.length) {

      throw new Error(
        "No se pudo actualizar la placa."
      );

    }

    placaActual.destination_url = url;

    status.textContent =
      "✓ Destino actualizado correctamente.";

  } catch (error) {

    status.textContent =
      error.message ||
      "No se pudo guardar el cambio.";

  } finally {

    button.disabled = false;
    button.textContent = "Guardar destino";

  }

}


/* -------------------------
   CERRAR SESIÓN
------------------------- */

async function cerrarSesion() {

  try {

    if (accessToken) {

      await fetch(
        `${SUPABASE_URL}/auth/v1/logout`,
        {
          method: "POST",

          headers: {
            apikey: SUPABASE_KEY,
            Authorization: `Bearer ${accessToken}`
          }
        }
      );

    }

  } catch {}

  localStorage.removeItem("deonetap_session");

  accessToken = null;
  placaActual = null;

  document.getElementById("panel").style.display =
    "none";

  document.getElementById("login").style.display =
    "block";

}


/* -------------------------
   RESTAURAR SESIÓN
------------------------- */

async function restaurarSesion() {

  const session = obtenerSesion();

  if (!session || !session.access_token) return;

  accessToken = session.access_token;

  await mostrarPanel();
await cargarEstadisticas();
}

// ==============================
// ESTADÍSTICAS DE LA PLACA
// ==============================

async function cargarEstadisticas() {
  if (!accessToken || !placaActual) return;

  try {
    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/interactions?deonetap_id=eq.${placaActual.id}&select=created_at,source`,
      {
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${accessToken}`
        }
      }
    );

    if (!response.ok) throw new Error("No se pudieron cargar estadísticas");

    const datos = await response.json();

    const ahora = new Date();

    const hoy = datos.filter(item => {
      const fecha = new Date(item.created_at);
      return fecha.toDateString() === ahora.toDateString();
    }).length;

    const ultimos7 = datos.filter(item => {
      const fecha = new Date(item.created_at);
      return ahora - fecha <= 7 * 24 * 60 * 60 * 1000;
    }).length;

    const ultimos30 = datos.filter(item => {
      const fecha = new Date(item.created_at);
      return ahora - fecha <= 30 * 24 * 60 * 60 * 1000;
    }).length;

    const qr = datos.filter(item => item.source === "qr").length;
    const nfc = datos.filter(item => item.source === "nfc").length;

    let caja = document.getElementById("estadisticas");

    if (!caja) {
      caja = document.createElement("div");
      caja.id = "estadisticas";
      caja.className = "card";

      const panel = document.getElementById("panel");
      panel.appendChild(caja);
    }

    caja.innerHTML = `
      <div class="label">ESTADÍSTICAS</div>
      <h2 style="color:#d4af37;">${datos.length} interacciones</h2>

      <p>Hoy: <strong>${hoy}</strong></p>
      <p>Últimos 7 días: <strong>${ultimos7}</strong></p>
      <p>Últimos 30 días: <strong>${ultimos30}</strong></p>

      <hr style="border-color:#292929;">

      <p>QR: <strong>${qr}</strong></p>
      <p>NFC: <strong>${nfc}</strong></p>
      <hr style="border-color:#292929; margin-top:25px;">

<div style="margin-top:20px;">
  <div class="label">INTERACCIONES · ÚLTIMOS 7 DÍAS</div>
  <div id="grafica7dias" style="
    display:flex;
    align-items:flex-end;
    gap:8px;
    height:150px;
    margin-top:20px;
  "></div>
  <div style="margin-top:30px;">
  <div class="label">HORARIOS DE MAYOR USO</div>
  <div id="graficaHoras" style="
    display:flex;
    align-items:flex-end;
    gap:4px;
    height:150px;
    margin-top:20px;
  "></div>
</div>
</div>
    `;
    // Crear gráfica de interacciones de los últimos 7 días
const grafica = document.getElementById("grafica7dias");

if (grafica) {
  const dias = [];

  for (let i = 6; i >= 0; i--) {
    const fecha = new Date();
    fecha.setDate(fecha.getDate() - i);

    const inicio = new Date(fecha);
    inicio.setHours(0, 0, 0, 0);

    const fin = new Date(fecha);
    fin.setHours(23, 59, 59, 999);

    const cantidad = datos.filter(item => {
      const fechaInteraccion = new Date(item.created_at);
      return fechaInteraccion >= inicio && fechaInteraccion <= fin;
    }).length;

    dias.push({
      nombre: fecha.toLocaleDateString("es-MX", { weekday: "short" }),
      cantidad
    });
  }

  const maximo = Math.max(...dias.map(d => d.cantidad), 1);

  grafica.innerHTML = dias.map(d => `
    <div style="
      flex:1;
      height:100%;
      display:flex;
      flex-direction:column;
      justify-content:flex-end;
      align-items:center;
      gap:6px;
    ">
      <span style="font-size:12px;">${d.cantidad}</span>

      <div style="
        width:100%;
        max-width:35px;
        height:${Math.max((d.cantidad / maximo) * 100, 3)}px;
        background:#d4af37;
        border-radius:6px 6px 2px 2px;
      "></div>

      <span style="font-size:11px;color:#999;">
        ${d.nombre}
      </span>
    </div>
  `).join("");
  // Crear gráfica de horarios de mayor uso
const graficaHoras = document.getElementById("graficaHoras");

if (graficaHoras) {
  const horas = Array(24).fill(0);

  datos.forEach(item => {
    const fecha = new Date(item.created_at);
    horas[fecha.getHours()]++;
  });

  const maxHora = Math.max(...horas, 1);

  graficaHoras.innerHTML = horas.map((cantidad, hora) => `
    <div style="
      flex:1;
      height:100%;
      display:flex;
      flex-direction:column;
      justify-content:flex-end;
      align-items:center;
      min-width:0;
    ">
      <span style="font-size:9px;margin-bottom:4px;">
        ${cantidad || ""}
      </span>

      <div style="
        width:100%;
        max-width:18px;
        height:${Math.max((cantidad / maxHora) * 100, 2)}px;
        background:#d4af37;
        border-radius:4px 4px 2px 2px;
      "></div>

      <span style="font-size:8px;margin-top:5px;">
        ${hora % 3 === 0 ? hora : ""}
      </span>
    </div>
  `).join("");
}
}
  } catch (error) {
    console.error("Error estadísticas:", error);
  }
}
  restaurarSesion();

</script>

</body>
</html>
